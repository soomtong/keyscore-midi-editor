name: CI

# 문서나 spikes/(워크스페이스 밖 기술 검증 코드)만 바뀐 변경에는 돌리지 않는다. assets/ 아래 Markdown은 프롬프트 템플릿이라
# 테스트가 읽으므로 제외 목록에 넣지 않는다(그래서 **.md 전체를 쓰지 않는다).
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "HANDOFF.md"
      - "MEMORY.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/**"
      - "plan/**"
      - ".claude/**"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "HANDOFF.md"
      - "MEMORY.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/**"
      - "plan/**"
      - ".claude/**"
      - "spikes/**"

# 같은 PR(또는 같은 브랜치)에 새 커밋이 오면 앞선 실행을 멈춘다. 한 실행이 30분쯤 걸려 겹치면 러너가 밀린다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 제품이 macOS 전용이고(REQ 8.3) midi·app이 CoreMIDI·Metal에 묶이므로 macOS 러너에서만 돈다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml의 채널과 컴포넌트를 rustup이 자동으로 설치한다.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 시험 동안 MIDI 서버가 내려가지 않게 클라이언트 하나를 쥐고 있는다(.github/ci/midi-keepalive.swift).
      # 띄우지 못해도 시험은 돌린다. 기록은 로그에 남긴다. 한 시험의 실패가 뒤 바이너리를 가리지 않게 --no-fail-fast로 돈다.
      - name: test
        run: |
          swift .github/ci/midi-keepalive.swift > "$RUNNER_TEMP/midi-keepalive.log" 2>&1 &
          keepalive=$!
          ready=no
          for _ in $(seq 1 120); do
            # 줄 전체가 ready일 때만. 오류 문구 속 "already" 같은 낱말에 걸리지 않게 한다(리뷰 2 제안 4).
            if grep -qx ready "$RUNNER_TEMP/midi-keepalive.log"; then ready=yes; break; fi
            kill -0 "$keepalive" 2>/dev/null || break
            sleep 1
          done
          echo "midi-keepalive: ready before tests=$ready"
          cat "$RUNNER_TEMP/midi-keepalive.log"
          # 공유 VM 러너에서 뜻이 없거나 재현되지 않는 시험만 이름으로 건너뛴다. 사람 Mac의 자동 게이트에서는
          # 그대로 돈다. 목록과 근거는 docs/decisions/2026-11-02-ci-runner-scope.md 「반영」.
          skip=(
            # 실시간 기준 측정(REQ 9.2, NF)
            playback_jitter_p99_within_half_ms_short
            playback_drift_within_1ms_short
            send_now_latency_p99_within_3ms
            # 벽시계 타이밍
            many_swaps_do_not_accumulate_rounding_drift
            click_longer_than_beat_stays_on_grid
            pause_just_before_loop_end_can_return_loop_end
            many_metronome_toggles_while_playing_stay_in_sync
            pause_with_full_queue_keeps_playing_and_a_later_pause_works
            tap_tempo_sets_tempo_from_intervals
            # CoreMIDI 환경
            create_virtual_output_long_names_are_enumerated_verbatim
            brk_metronome_port_vanish_and_return_while_playing
            brk_port_list_refreshes_on_hotplug
          )
          args=()
          for name in "${skip[@]}"; do args+=(--skip "$name"); done
          status=0
          cargo test --workspace --no-fail-fast -- --exact "${args[@]}" || status=$?
          # 실패가 「가설이 틀림」인지 「keepalive가 없었음」인지 가르려고 시험 뒤 생존을 남긴다(리뷰 1 지적 1).
          if kill -0 "$keepalive" 2>/dev/null; then
            echo "midi-keepalive: alive after tests (ready before tests=$ready)"
          else
            echo "midi-keepalive: not alive after tests (ready before tests=$ready)"
            cat "$RUNNER_TEMP/midi-keepalive.log"
          fi
          exit "$status"
      - name: dependency direction
        run: scripts/check-deps.sh
      - name: dependency check regression
        run: scripts/check-deps.test.sh
      # 벤치 자체(scripts/bench-check.py)는 러너 기준값이 생길 때까지 넣지 않는다(S8 이월).
      - name: bench check regression
        run: scripts/bench-check.test.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: deny
        run: cargo deny check
