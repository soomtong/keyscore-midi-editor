name: CI

# 문서나 spikes/(워크스페이스 밖 기술 검증 코드)만 바뀐 변경에는 돌리지 않는다. assets/ 아래 Markdown은 프롬프트 템플릿이라
# 테스트가 읽으므로 제외 목록에 넣지 않는다(그래서 **.md 전체를 쓰지 않는다).
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "HANDOFF.md"
      - "MEMORY.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/**"
      - "plan/**"
      - ".claude/**"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "HANDOFF.md"
      - "MEMORY.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/**"
      - "plan/**"
      - ".claude/**"
      - "spikes/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 제품이 macOS 전용이고(REQ 8.3) midi·app이 CoreMIDI·Metal에 묶이므로 macOS 러너에서만 돈다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml의 채널과 컴포넌트를 rustup이 자동으로 설치한다.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 시험 동안 MIDI 서버가 내려가지 않게 클라이언트 하나를 쥐고 있는다(.github/ci/midi-keepalive.swift).
      # 띄우지 못해도 시험은 돌린다. 기록은 로그에 남긴다. 한 시험의 실패가 뒤 바이너리를 가리지 않게 --no-fail-fast로 돈다.
      - name: test
        run: |
          swift .github/ci/midi-keepalive.swift > "$RUNNER_TEMP/midi-keepalive.log" 2>&1 &
          keepalive=$!
          ready=no
          for _ in $(seq 1 120); do
            # 줄 전체가 ready일 때만. 오류 문구 속 "already" 같은 낱말에 걸리지 않게 한다(리뷰 2 제안 4).
            if grep -qx ready "$RUNNER_TEMP/midi-keepalive.log"; then ready=yes; break; fi
            kill -0 "$keepalive" 2>/dev/null || break
            sleep 1
          done
          echo "midi-keepalive: ready before tests=$ready"
          cat "$RUNNER_TEMP/midi-keepalive.log"
          status=0
          cargo test --workspace --no-fail-fast || status=$?
          # 실패가 「가설이 틀림」인지 「keepalive가 없었음」인지 가르려고 시험 뒤 생존을 남긴다(리뷰 1 지적 1).
          if kill -0 "$keepalive" 2>/dev/null; then
            echo "midi-keepalive: alive after tests (ready before tests=$ready)"
          else
            echo "midi-keepalive: not alive after tests (ready before tests=$ready)"
            cat "$RUNNER_TEMP/midi-keepalive.log"
          fi
          exit "$status"
      - name: dependency direction
        run: scripts/check-deps.sh
      - name: dependency check regression
        run: scripts/check-deps.test.sh
      # 벤치 자체(scripts/bench-check.py)는 러너 기준값이 생길 때까지 넣지 않는다(S8 이월).
      - name: bench check regression
        run: scripts/bench-check.test.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: deny
        run: cargo deny check
