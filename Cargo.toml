[workspace]
resolver = "3"
members = [
  "crates/keyscore-core",
  "crates/keyscore-text",
  "crates/keyscore-midi",
  "crates/keyscore-ai",
  "crates/keyscore-app",
  "tools/ksq-cli",
  "tools/ksq-play",
]
# 스파이크는 제품 빌드에 섞이지 않는다(plan/02-spikes.md 게이트).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
publish = false

# 내부 crate는 여기서만 경로를 정하고, 각 crate는 workspace = true로 가져온다.
# 의존 방향 자체는 각 crate의 [dependencies]와 scripts/check-deps.sh가 지킨다.
[workspace.dependencies]
keyscore-core = { path = "crates/keyscore-core" }
keyscore-text = { path = "crates/keyscore-text" }
keyscore-midi = { path = "crates/keyscore-midi" }
keyscore-ai = { path = "crates/keyscore-ai" }
thiserror = "2"
# float_roundtrip: 모르는 키의 실수가 저장할 때마다 바뀌지 않게 한다(S0-T6 리뷰 1 지적 2).
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
# CoreMIDI: 프로토콜 지정 가상 소스와 할당 없는 송신 때문에 sys를 직접 쓴다(SP-3 분기 B).
coremidi-sys = "3.2.1"
# 포트 이름을 NFC로 맞춰 정준 동치 이름을 같은 이름으로 본다(S1-T1 리뷰 3).
unicode-normalization = "0.1"
# 스케줄러: 락 없는 SPSC 링버퍼, 디버그 빌드의 실시간 루프 할당 검사(REQ 9.2).
rtrb = "0.4"
assert_no_alloc = "1.1"
core-foundation = "0.10"
# 통합 테스트의 독립 수신기(구현과 다른 경로로 받아 대조한다).
coremidi = "0.9.2"
insta = "1"
proptest = "1"
# 그래프(plotters)·병렬(rayon)을 빼서 의존 트리를 줄인다. 수치 비교만 쓴다.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
