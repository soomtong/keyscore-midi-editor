# 의존성 정책. 라이선스 허용 목록은 plan/00-conventions.md와
# docs/decisions/2026-10-11-license-allowlist.md(결정 B)를 따른다.
# 목록을 넓히는 변경은 결정 요청을 거친다.

[graph]
# 제품은 macOS 전용(REQ 8.3)이다. 다른 플랫폼 전용 의존까지 검사하면
# 배포되지 않는 crate 때문에 게이트가 막힌다.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
yanked = "deny"
# 결정 2026-10-16-gpui-kit-licenses-and-advisories A: gpui-kit이 고정한 GPUI 스냅샷(REQ 9.1)의 전이
# 의존에 걸린 유지보수 중단 알림이다. 취약점이 아니고 안전한 업그레이드가 없다. gpui-kit을 올릴 때마다
# 이 목록을 다시 본다.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: GPUI 스냅샷 전이 의존, 업그레이드 없음" },
  { id = "RUSTSEC-2024-0436", reason = "paste: gpui-component·metal 전이 의존, 업그레이드 없음" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: usvg ← gpui-pre 전이 의존, 업그레이드 없음" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: 폰트 경로 전이 의존, 업그레이드 없음" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  # 결정 B: ICU 계열·unicode-ident(Unicode-3.0), libbz2-rs-sys(bzip2-1.0.6),
  # cbindgen·option-ext(MPL-2.0). MPL crate는 수정 없이 쓴다.
  "Unicode-3.0",
  "bzip2-1.0.6",
  "MPL-2.0",
  # 결정 2026-10-16-gpui-kit-licenses-and-advisories A: gpui-kit의 전이 의존.
  # enum-iterator(0BSD, 고지 의무도 없는 BSD 계열), notify(CC0-1.0, 퍼블릭 도메인 헌정).
  "0BSD",
  "CC0-1.0",
]
# BSD-1-Clause(assert_no_alloc, S1-T4)는 REQ 8.4의 「BSD」 계열이고 BSD-2보다 조건이 적다.
confidence-threshold = 0.9
# 워크스페이스 crate 자신은 publish = false라 라이선스 검사 대상에서 뺀다.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 path 의존(publish = false)은 버전 없이 쓴다.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
