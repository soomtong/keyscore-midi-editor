# 의존성 정책. 라이선스 허용 목록은 plan/00-conventions.md를 그대로 따른다.
# 목록을 넓히는 변경은 docs/decisions/2026-10-11-license-allowlist.md의 결정을 거친다.

[graph]
# 제품은 macOS 전용(REQ 8.3)이다. 다른 플랫폼 전용 의존까지 검사하면
# 배포되지 않는 crate 때문에 게이트가 막힌다.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
]
confidence-threshold = 0.9
# 워크스페이스 crate 자신은 publish = false라 라이선스 검사 대상에서 뺀다.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 path 의존(publish = false)은 버전 없이 쓴다.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
